<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Tidy · 整理标签页</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="panel" aria-busy="true">
  <header>
    <div class="brand-lockup"><img class="brand-mark" src="assets/icon-48.png" alt=""><span>Tab Tidy</span></div>
    <button class="icon-button" id="openSettings" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.8 3-.6 2a7 7 0 0 0-1.4.8l-2-.5L3.6 9l1.4 1.5a7 7 0 0 0 0 1.6L3.6 14l2.2 3.7 2-.5a7 7 0 0 0 1.4.8l.6 2h4.4l.6-2a7 7 0 0 0 1.4-.8l2 .5 2.2-3.7-1.4-1.9a7 7 0 0 0 0-1.6L20.4 9l-2.2-3.7-2 .5a7 7 0 0 0-1.4-.8l-.6-2Zm2.2 5a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z"/></svg>
    </button>
  </header>
  <section class="masthead"><h1 id="heading">整理标签页</h1><p id="subtitle">把当前窗口，留给正在做的事。</p></section>
  <p id="loading" class="muted">正在读取配置…</p>
  <section id="setup" hidden>
    <form id="keyForm">
      <label id="apiKeyLabel" for="apiKey">DeepSeek API Key</label>
      <input id="apiKey" type="password" required autocomplete="off" spellcheck="false" placeholder="粘贴 API Key" aria-describedby="setupHint">
      <p id="setupHint" class="field-hint">Key 保存在本机，用于请求所选 AI 服务。</p>
      <button class="primary" type="submit" disabled><span>保存并开始使用</span><b aria-hidden="true">→</b></button>
    </form>
    <button class="text-button" id="configureApi" type="button">选择其他 AI 服务 <span aria-hidden="true">↗</span></button>
  </section>
  <section id="ready" hidden>
    <div class="scope-card"><div class="scope-heading"><span>当前窗口</span><strong id="tabCount">—</strong></div><p id="scopeHint">保留固定标签和已有分组</p></div>
    <label class="regroup-toggle"><span>重整已有标签组</span><input id="includeGrouped" type="checkbox" role="switch" aria-describedby="scopeHint"></label>
    <button class="primary" id="organize" type="button" disabled><span>开始整理</span><b aria-hidden="true">→</b></button>
    <button class="service-button" id="configureReady" type="button"><span class="service-dot" aria-hidden="true"></span><span id="serviceName">AI 服务</span><span class="service-model" id="serviceModel"></span><span aria-hidden="true">↗</span></button>
  </section>
  <section id="result" class="result" hidden aria-live="polite"></section>
  <p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
