<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>标签页整理</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header>
        <div class="brand-lockup">
          <img class="brand-mark" src="assets/icon-48.png" alt="">
        </div>
        <button class="icon-button" id="openSettings" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2Zm8.1 3.6 1.55-1.2-1.8-3.12-1.86.76a7.28 7.28 0 0 0-1.7-.98L16 5.5h-3.6l-.3 1.96c-.6.2-1.17.53-1.7.98l-1.86-.76-1.8 3.12L8.3 12c-.02.66.07 1.3.26 1.9l-1.56 1.2 1.8 3.12 1.86-.76c.53.45 1.1.78 1.7.98l.3 1.96H16l.3-1.96c.6-.2 1.17-.53 1.7-.98l1.86.76 1.8-3.12-1.56-1.2c.2-.6.28-1.24.26-1.9Z"/></svg>
        </button>
      </header>

      <section class="masthead">
        <h1>整理标签页</h1>
      </section>

      <section id="setup" hidden>
        <form id="keyForm">
          <label for="apiKey">DeepSeek API Key</label>
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴 API Key">
          <button class="primary" type="submit"><span>保存并开始使用</span><b>→</b></button>
        </form>
      </section>

      <section id="ready" hidden>
        <button class="primary" id="organize" type="button"><span>开始整理</span><b>→</b></button>
      </section>

      <section id="result" class="result" hidden aria-live="polite"></section>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
