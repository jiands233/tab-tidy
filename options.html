<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>标签页整理设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <img class="brand-mark" src="assets/icon-48.png" alt="">
      </header>
      <h1>整理偏好</h1>
      <p class="intro">仅保存在这台设备中</p>
      <section class="card">
        <div class="key-status">
          <span>API Key</span>
          <p id="savedKey" class="saved-key"></p>
        </div>
        <form id="keyForm">
          <label for="apiKey">替换 Key</label>
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴新的 API Key">
          <div class="actions">
            <button class="save" type="submit">保存更改</button>
            <button id="clearKey" class="danger" type="button">清除</button>
          </div>
        </form>
      </section>
      <section class="card">
        <div class="section-heading">
          <h2>分组规则</h2>
          <p>让主题更突出，也可以按你的阅读语言命名。</p>
        </div>
        <label for="groupingLanguage">命名语言</label>
        <select id="groupingLanguage"></select>
        <label for="groupingDetail">分组细致度</label>
        <select id="groupingDetail"></select>
        <label for="groupingStyle">命名形式</label>
        <select id="groupingStyle"></select>
        <p class="help" id="namingExample" aria-live="polite"></p>
        <label class="palette-label" for="groupingPalette">标签组配色</label>
        <select id="groupingPalette"></select>
        <div id="singleColorRow" hidden>
          <label for="groupingColor">所有分组统一使用</label>
          <select id="groupingColor"></select>
        </div>
        <div class="group-preview" id="groupPreview" aria-label="分组外观示例"></div>
        <p class="help">配色示意以实际浏览器显示为准。新用户默认灰蓝双色和 emoji 前缀。</p>
        <button class="save full-width" id="savePreferences" type="button" disabled>保存分组规则</button>
        <button class="apply-appearance full-width" id="restyleGroups" type="button" disabled>保存并更新上次分组的外观</button>
        <p class="help">外观更新仅调整上次整理生成的组（30 分钟内），手动改过的组会跳过。需要重新分类或整体改名时，在弹窗开启“重整已有标签组”。</p>
      </section>
      <p id="feedback" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
