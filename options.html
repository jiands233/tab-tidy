<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>标签页整理设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <img class="brand-mark" src="assets/icon-48.png" alt="">
      </header>
      <h1>整理偏好</h1>
      <section class="card">
        <div class="key-status">
          <span>AI 服务</span>
          <p id="savedKey" class="saved-key"></p>
        </div>
        <form id="keyForm">
          <label for="apiProvider">API 类型</label>
          <select id="apiProvider"></select>
          <label for="apiBaseUrl">API 地址</label>
          <input id="apiBaseUrl" type="url" required spellcheck="false" autocomplete="off" placeholder="https://api.openai.com/v1">
          <label for="apiModel">模型名称</label>
          <input id="apiModel" type="text" required spellcheck="false" autocomplete="off" placeholder="填写服务提供的模型名称">
          <label for="apiKey">API Key</label>
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴新的 API Key">
          <div class="actions">
            <button class="save" id="saveApi" type="submit" disabled>保存 API 配置</button>
            <button id="clearKey" class="danger" type="button" disabled>清除 Key</button>
          </div>
        </form>
      </section>
      <section class="card">
        <div class="section-heading">
          <h2>分组规则</h2>
        </div>
        <label for="groupingLanguage">命名语言</label>
        <select id="groupingLanguage"></select>
        <label for="groupingDetail">分组细致度</label>
        <select id="groupingDetail"></select>
        <label for="groupingStyle">命名形式</label>
        <select id="groupingStyle"></select>
        <label class="palette-label" for="groupingPalette">标签组配色</label>
        <select id="groupingPalette"></select>
        <div id="singleColorRow" hidden>
          <label for="groupingColor">所有分组统一使用</label>
          <select id="groupingColor"></select>
        </div>
        <div class="group-preview" id="groupPreview" aria-label="分组外观示例"></div>
        <button class="save full-width" id="savePreferences" type="button" disabled>保存分组规则</button>
        <button class="apply-appearance full-width" id="restyleGroups" type="button" disabled>保存并更新上次分组的外观</button>
      </section>
      <p id="feedback" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
