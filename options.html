<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>标签页整理设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <img class="brand-mark" src="assets/icon-48.png" alt="">
      </header>
      <h1>DeepSeek API</h1>
      <p class="intro">仅保存在这台设备中</p>
      <section class="card">
        <div class="key-status">
          <span>API Key</span>
          <p id="savedKey" class="saved-key"></p>
        </div>
        <form id="keyForm">
          <label for="apiKey">替换 Key</label>
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴新的 API Key">
          <div class="actions">
            <button class="save" type="submit">保存更改</button>
            <button id="clearKey" class="danger" type="button">清除</button>
          </div>
        </form>
      </section>
      <p id="feedback" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
